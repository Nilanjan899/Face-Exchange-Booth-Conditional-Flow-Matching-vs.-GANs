<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Exchange Booth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --bg:#1b1030; --panel:#cfc9e0; --ink:#14091f; --violet:#8a2be2; --violet-d:#4b0f8a;
  --yellow:#ffe14d; --hi:#fff; --lo:#6d6684;
  --px:'Press Start 2P','Courier New',monospace; --body:'VT323','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:22px}
body{overflow-x:hidden}

/* wiggling image wall */
#wall{position:fixed;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:6px;padding:6px;z-index:0}
.tile{position:relative;border:4px solid var(--ink);background:#000;overflow:hidden;cursor:pointer;
  animation:wig 3.4s ease-in-out infinite alternate;animation-delay:var(--d);transform-origin:center}
.tile img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.8) brightness(.55);transition:filter .15s}
.tile:hover img,.tile.picked img{filter:none}
.tile.picked{outline:6px solid var(--yellow);outline-offset:-6px;z-index:2}
.tile .tag{position:absolute;left:0;top:0;background:var(--yellow);color:var(--ink);font:10px/1 var(--px);padding:8px;display:none}
.tile.picked .tag{display:block}
@keyframes wig{
  0%{transform:rotate(-.9deg) scale(1.01) translate(-2px,1px)}
  100%{transform:rotate(.9deg) scale(1.03) translate(2px,-1px)}
}

/* chrome */
.ui{position:relative;z-index:5;pointer-events:none;min-height:100vh;display:flex;flex-direction:column}
.ui>*{pointer-events:auto}
header{margin:14px auto 0;max-width:min(92vw,820px);width:100%}
.bevel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo),8px 8px 0 var(--ink)}
.titlebar{background:linear-gradient(90deg,var(--violet-d),var(--violet));color:#fff;font:12px/1 var(--px);padding:10px;display:flex;justify-content:space-between;align-items:center}
.titlebar i{font-style:normal;background:var(--panel);color:var(--ink);padding:2px 6px;border:2px solid var(--ink)}
h1{margin:0;padding:18px 12px;text-align:center;font:clamp(16px,4vw,32px)/1.3 var(--px);text-shadow:4px 4px 0 var(--hi)}
.sub{text-align:center;padding:0 12px 14px;margin:0}

#tray{margin:auto auto 16px;max-width:min(92vw,820px);width:100%}
.slots{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px;flex-wrap:wrap}
.slot{width:110px;height:110px;border:4px solid var(--ink);background:#e9e5f3;display:grid;place-items:center;
  font:9px/1.6 var(--px);text-align:center;background-size:cover;background-position:center;box-shadow:inset 3px 3px 0 var(--lo)}
.plus{font:28px var(--px)}
.hint{text-align:center;padding:0 12px 14px;margin:0}

button{font:12px/1 var(--px);color:var(--ink);background:var(--panel);border:4px solid var(--ink);padding:14px 20px;cursor:pointer;
  box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo),4px 4px 0 var(--ink)}
button:active{transform:translate(4px,4px);box-shadow:inset 3px 3px 0 var(--lo)}
button.go{background:var(--yellow)}
button:focus-visible,.tile:focus-visible{outline:4px dashed var(--violet);outline-offset:3px}

/* modal + results */
.overlay{position:fixed;inset:0;background:rgba(20,9,31,.8);z-index:20;display:none;overflow:auto;padding:16px}
.overlay.on{display:block}
.box{max-width:820px;margin:4vh auto}
.body{padding:18px;text-align:center}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px}

.pair{display:flex;align-items:center;justify-content:center;gap:12px}
.pair .slot{width:130px;height:130px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.lane{display:flex;flex-direction:column;align-items:center}
.lane h3{margin:8px 0;font:11px/1.5 var(--px)}

/* arrow that fills with violet fluid */
.arrow{position:relative;width:56px;height:96px;
  clip-path:polygon(30% 0,70% 0,70% 55%,100% 55%,50% 100%,0 55%,30% 55%);background:var(--ink)}
.arrow::before{content:"";position:absolute;inset:4px;background:#e9e5f3;
  clip-path:polygon(30% 0,70% 0,70% 55%,100% 55%,50% 100%,0 55%,30% 55%)}
.fluid{position:absolute;left:0;right:0;top:0;height:0%;background:var(--violet);
  clip-path:polygon(30% 0,70% 0,70% 55%,100% 55%,50% 100%,0 55%,30% 55%);transition:height .4s steps(12)}
.fluid::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:8px;
  background:repeating-linear-gradient(90deg,#b36cff 0 8px,var(--violet) 8px 16px);animation:slosh .5s steps(2) infinite}
@keyframes slosh{50%{transform:translateX(8px)}}
.pct{font:10px var(--px);margin-top:6px;min-height:12px}

.out{width:100%;max-width:300px;aspect-ratio:1;border:4px solid var(--ink);background:#e9e5f3 repeating-conic-gradient(#d8d2ea 0 25%,#e9e5f3 0 50%) 0 0/24px 24px;
  display:grid;place-items:center;font:9px/1.7 var(--px);padding:8px;overflow:hidden;box-shadow:inset 3px 3px 0 var(--lo)}
.out img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:auto}
.err{color:#a00020}
.topbar{display:flex;justify-content:flex-end;padding:10px 14px 0}
.topbar button{font-size:11px;padding:12px 14px}
.mine{display:none;padding:0 14px 12px;text-align:center}
.mine.on{display:block}
.mine p{margin:0 0 6px}
.thumbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.thumb{width:56px;height:56px;border:4px solid var(--ink);background-size:cover;background-position:center;cursor:pointer;padding:0;box-shadow:none}
.thumb.picked{outline:4px solid var(--yellow);outline-offset:0}
#upmsg{min-height:22px;text-align:center;margin:0 0 8px}
@media (max-width:560px){.outs{grid-template-columns:1fr}.slot{width:90px;height:90px}}
@media (prefers-reduced-motion:reduce){.tile,.fluid::after{animation:none}}
</style>
</head>
<body>
<div id="wall" aria-label="Pick images"></div>

<div class="ui">
  <div class="topbar">
    <button id="upBtn" type="button">Upload custom picture</button>
    <input id="upIn" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  </div>
  <header class="bevel">
    <div class="titlebar"><span>BOOTH.EXE</span><i>x</i></div>
    <h1>Face Exchange Booth</h1>
    <p class="sub">Click one photo for the source, another for the target.</p>
  </header>

  <section id="tray" class="bevel">
    <div class="slots">
      <div class="slot" id="slotS">Source</div>
      <div class="plus">+</div>
      <div class="slot" id="slotT">Target</div>
    </div>
    <div class="mine" id="mine"><p>Your uploads</p><div class="thumbs" id="thumbs"></div></div>
    <p class="hint" id="hint">Pick the source photo from the wall.</p>
    <p id="upmsg" class="err"></p>
    <div class="row" style="margin:0 0 16px"><button id="clear">Clear picks</button></div>
  </section>
</div>

<!-- confirm -->
<div class="overlay" id="confirm">
  <div class="box bevel">
    <div class="titlebar"><span>CONFIRM</span></div>
    <div class="body">
      <div class="pair"><div class="slot" id="cS"></div><div class="plus">+</div><div class="slot" id="cT"></div></div>
      <p>Swap these two faces with both models?</p>
      <div class="row"><button class="go" id="yes">Yes, generate</button><button id="no">No, pick again</button></div>
    </div>
  </div>
</div>

<!-- results -->
<div class="overlay" id="results">
  <div class="box bevel">
    <div class="titlebar"><span>DEVELOPING...</span></div>
    <div class="body">
      <div class="pair"><div class="slot" id="rS"></div><div class="plus">+</div><div class="slot" id="rT"></div></div>
      <div class="outs">
        <div class="lane">
          <div class="arrow"><div class="fluid" id="fl-gan"></div></div>
          <div class="pct" id="pc-gan"></div>
          <h3>GAN</h3><div class="out" id="out-gan"></div>
        </div>
        <div class="lane">
          <div class="arrow"><div class="fluid" id="fl-flow"></div></div>
          <div class="pct" id="pc-flow"></div>
          <h3>FLOW</h3><div class="out" id="out-flow"></div>
        </div>
      </div>
      <div class="row"><button class="go" id="again">New swap</button></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const url = n => n.startsWith('uploads/') ? '/' + n : '/images/' + encodeURIComponent(n);
const bg = (el, n) => { el.style.backgroundImage = n ? `url(${url(n)})` : ''; el.textContent = n ? '' : el.dataset.label; };
let names = [], mine = [], src = null, tgt = null, running = false;
$('slotS').dataset.label = 'Source'; $('slotT').dataset.label = 'Target';

// rough ETA (seconds) used only to pace the fluid; real completion jumps it to 100%
const ETA = { gan: 8, flow: 25 };

async function init() {
  names = await (await fetch('/api/images')).json();
  const wall = $('wall');
  names.slice(0, 10).forEach((n, i) => {
    const t = document.createElement('div');
    t.className = 'tile'; t.tabIndex = 0; t.dataset.name = n;
    t.style.setProperty('--d', (-(i * 0.57) % 3.4).toFixed(2) + 's');
    t.innerHTML = `<img src="${url(n)}" alt=""><span class="tag"></span>`;
    t.onclick = () => pick(n);
    t.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(n); } };
    wall.appendChild(t);
  });
  mine = await (await fetch('/api/uploads')).json();
  renderMine();
}

function renderMine() {
  $('mine').classList.toggle('on', mine.length > 0);
  const box = $('thumbs'); box.innerHTML = '';
  mine.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'thumb'; b.title = 'Use this picture';
    b.style.backgroundImage = `url(${url(n)})`; b.dataset.name = n;
    b.onclick = () => pick(n);
    box.appendChild(b);
  });
  render();
}

$('upBtn').onclick = () => { if (!running) $('upIn').click(); };
$('upIn').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append('files', f));
  $('upmsg').textContent = 'Uploading...';
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Upload failed');
    $('upmsg').textContent = '';
    mine.push(...d); renderMine();
    // fill any empty slots with the new pictures, source first
    for (const n of d) {
      if (!src) src = n; else if (!tgt) tgt = n; else break;
    }
    render();
    if (src && tgt) { bg($('cS'), src); bg($('cT'), tgt); $('confirm').classList.add('on'); }
  } catch (err) { $('upmsg').textContent = err.message; }
};

function pick(n) {
  if (running) return;
  if (n === src) src = null;
  else if (n === tgt) tgt = null;
  else if (!src) src = n;
  else if (!tgt) tgt = n;
  else tgt = n;
  render();
  if (src && tgt) { bg($('cS'), src); bg($('cT'), tgt); $('confirm').classList.add('on'); }
}

function render() {
  document.querySelectorAll('.tile').forEach(t => {
    const n = t.dataset.name, p = n === src || n === tgt;
    t.classList.toggle('picked', p);
    t.querySelector('.tag').textContent = n === src ? 'SOURCE' : n === tgt ? 'TARGET' : '';
  });
  document.querySelectorAll('.thumb').forEach(t => {
    t.classList.toggle('picked', t.dataset.name === src || t.dataset.name === tgt);
  });
  bg($('slotS'), src); bg($('slotT'), tgt);
  $('hint').textContent = !src ? 'Pick the source photo from the wall.' : !tgt ? 'Now pick the target photo.' : 'Ready.';
}

$('clear').onclick = () => { src = tgt = null; render(); };
$('no').onclick = () => { tgt = null; $('confirm').classList.remove('on'); render(); };
$('again').onclick = () => { $('results').classList.remove('on'); running = false; src = tgt = null; render(); };

$('yes').onclick = () => {
  $('confirm').classList.remove('on');
  running = true;
  bg($('rS'), src); bg($('rT'), tgt);
  $('results').classList.add('on');
  ['gan', 'flow'].forEach(m => generate(m));
};

async function generate(m) {
  const fl = $('fl-' + m), pc = $('pc-' + m), out = $('out-' + m);
  out.textContent = 'Developing...'; fl.style.height = '0%'; pc.textContent = '0%';
  const t0 = performance.now();
  // ease toward 92% so the arrow never claims "done" before the model is
  const timer = setInterval(() => {
    const s = (performance.now() - t0) / 1000;
    const p = 92 * (1 - Math.exp(-s / (ETA[m] / 2)));
    fl.style.height = p.toFixed(0) + '%'; pc.textContent = p.toFixed(0) + '%';
  }, 400);
  try {
    const r = await fetch('/api/generate/' + m, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: src, target: tgt })
    });
    const d = await r.json();
    clearInterval(timer);
    if (!r.ok) throw new Error(d.error || 'Generation failed');
    fl.style.height = '100%'; pc.textContent = '100%';
    out.innerHTML = `<img alt="${m} result" src="${d.url}">`;
  } catch (e) {
    clearInterval(timer);
    pc.textContent = 'ERROR';
    out.innerHTML = `<span class="err">${e.message}<br>Check the terminal, then try again.</span>`;
  }
}

init();
</script>
</body>
</html>
